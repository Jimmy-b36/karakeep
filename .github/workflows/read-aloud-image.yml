name: Read Aloud AIO Image (ARM64)

# Fork-specific workflow for the karakeep-read-aloud fork. Builds only the aio
# image for linux/arm64 and publishes it under the fork's GHCR namespace with an
# immutable sha-<commit> tag. The parent workflow/deployment consumes the
# registry digest from this run's summary.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    timeout-minutes: 240
    env:
      IMAGE: ghcr.io/jimmy-b36/karakeep-read-aloud:sha-${{ github.sha }}
      SERVER_VERSION: sha-${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # yamllint disable-line rule:line-length

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build aio image (linux/arm64)
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/arm64 \
            --target aio \
            --file docker/Dockerfile \
            --build-arg SERVER_VERSION="${SERVER_VERSION}" \
            --load \
            --tag "${IMAGE}" \
            .

      - name: Smoke test aio image
        env:
          # Synthetic values only; no production secrets. --network none keeps
          # the container off the network while still providing loopback for the
          # in-container health check.
          NEXTAUTH_SECRET: smoke-test-synthetic-secret
          NEXTAUTH_URL: http://localhost:3000
        run: |
          set -euo pipefail
          CONTAINER="karakeep-read-aloud-smoke"
          docker rm -f "${CONTAINER}" >/dev/null 2>&1 || true
          docker run -d \
            --name "${CONTAINER}" \
            --network none \
            --memory 2g \
            --cpus 2 \
            --pids-limit 512 \
            -e DATA_DIR=/tmp \
            -e NEXTAUTH_SECRET="${NEXTAUTH_SECRET}" \
            -e NEXTAUTH_URL="${NEXTAUTH_URL}" \
            "${IMAGE}"

          cleanup() {
            docker rm -f "${CONTAINER}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for i in $(seq 1 90); do
            if docker exec "${CONTAINER}" curl -fsS --max-time 5 \
              http://127.0.0.1:3000/api/health; then
              echo "::notice::Smoke test passed: /api/health responded"
              exit 0
            fi
            sleep 2
          done

          echo "::error::Smoke test failed: /api/health did not respond"
          docker logs --tail 100 "${CONTAINER}" >&2 || true
          exit 1

      - name: Push image and record digest
        id: push
        run: |
          set -euo pipefail
          docker push "${IMAGE}"
          FORMAT='{{index .RepoDigests 0}}'
          DIGEST="$(docker inspect --format "${FORMAT}" "${IMAGE}")"
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Read Aloud AIO image"
            echo ""
            echo "- Image: \`${IMAGE}\`"
            echo "- Digest: \`${DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
