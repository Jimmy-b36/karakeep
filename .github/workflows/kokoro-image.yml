name: Build local Kokoro speech (ARM64)
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      IMAGE: ghcr.io/jimmy-b36/karakeep-kokoro:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build pinned offline service
        run: docker buildx build --platform linux/arm64 --file docker/kokoro/Dockerfile --load --tag "${IMAGE}" .
      - name: Offline audio and word timing smoke test
        run: |
          set -euo pipefail
          PHONEMIZER_TMPFS="/opt/phonemizer-tmp:rw,nosuid,nodev,exec,size=16m"
          PHONEMIZER_TMPFS+=",mode=0700,uid=10001,gid=10001"
          docker run -d --name kokoro-smoke --network none --cap-drop ALL --security-opt no-new-privileges \
            --memory 2560m --cpus 3 --pids-limit 256 --read-only \
            --tmpfs /tmp:rw,nosuid,noexec,size=256m \
            --tmpfs /cache:noexec,uid=10001,gid=10001,size=64m \
            --tmpfs "$PHONEMIZER_TMPFS" -e TMPDIR=/opt/phonemizer-tmp \
            -e KOKORO_TOKEN=synthetic-test-token-000000000000000000 "${IMAGE}"
          docker exec -i kokoro-smoke python - <<'PY'
          import base64, json, sys, time, urllib.request, urllib.error
          sys.path.insert(0, '/opt')
          from service import MAX_TEXT_LENGTH
          base = 'http://127.0.0.1:4320'
          for attempt in range(60):
              try:
                  urllib.request.urlopen(base + '/health', timeout=2)
                  break
              except (OSError, urllib.error.URLError):
                  time.sleep(1)
          else:
              raise RuntimeError('Service did not become healthy')
          try:
              urllib.request.urlopen(base + '/voices')
              raise RuntimeError('Unauthenticated voice request allowed')
          except urllib.error.HTTPError as error:
              assert error.code == 401
          headers = {'Authorization': 'Bearer synthetic-test-token-000000000000000000', 'Content-Type': 'application/json'}
          texts = [
              'Hello world. This is a local word timing check.',
              ('Yes. Exactly. This is a complete thought '
               'with enough context for natural narration. '
               * 5)[:MAX_TEXT_LENGTH],
              'Yes. Exactly. This thought continues\n'
              'across a wrapped line with original word offsets.',
              'Katie Hempenius',
              'Katie Hempenius\n\n\n\n',
          ]
          for text in texts:
              started = time.monotonic()
              body = {'text': text, 'voice': 'kokoro:bf_emma'}
              request = urllib.request.Request(
                  base + '/synthesize', data=json.dumps(body).encode(),
                  headers=headers,
              )
              response = json.load(urllib.request.urlopen(request, timeout=70))
              audio = base64.b64decode(response['audio'], validate=True)
              assert audio[:4] == b'RIFF' and audio[8:12] == b'WAVE'
              assert len(response['words']) >= (2 if len(text) < 20 else 8)
              if text.startswith('Katie '):
                  spans = [text[w['from']:w['to']].strip()
                           for w in response['words']]
                  assert 'Katie' in spans and 'Hempenius' in spans
              for word in response['words']:
                  assert text[word['from']:word['to']].strip()
                  assert 0 <= word['start'] <= word['end'] <= response['duration'] + 0.1
              print(json.dumps({
                  'characters': len(text),
                  'seconds': round(time.monotonic() - started, 2),
                  'audio_seconds': response['duration'],
              }))
          print('Offline authenticated synthesis and word timings passed')
          PY
          docker stats --no-stream kokoro-smoke
      - name: Publish smoke-tested image
        run: |
          set -euo pipefail
          docker push "${IMAGE}"
          docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}" >> "$GITHUB_STEP_SUMMARY"
      - name: Cleanup
        if: always()
        run: docker rm -f kokoro-smoke || true
